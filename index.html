<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4ooth - Игра</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
  }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    padding: 20px;
  }

  /* ===== ГЛАВНОЕ МЕНЮ ===== */
  .menu {
    text-align: center;
    padding: 40px 60px;
    border: 1px solid #1a1a1a;
    border-radius: 20px;
    background: #050505;
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2b2b2b, #0a0a0a);
    border: 2px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
  }

  .title {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 10px;
    background: linear-gradient(180deg, #ffffff, #7a7a7a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 16px;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 35px;
  }

  .btn-start {
    padding: 16px 55px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e0e0e0;
    background: #2e2e2e;
    border: 1px solid #3d3d3d;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    outline: none;
  }

  .btn-start:hover {
    background: #3a3a3a;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
  }

  .btn-start:active {
    transform: scale(0.97);
    background: #262626;
  }

  /* ===== ФОРМА ПРОФИЛЯ ===== */
  .profile-form {
    display: none;
    text-align: center;
    padding: 40px 50px;
    border: 1px solid #1a1a1a;
    border-radius: 20px;
    background: #050505;
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
    width: 100%;
    max-width: 480px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .profile-form.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .form-title {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #ffffff, #7a7a7a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .form-subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
  }

  .avatar-upload {
    position: relative;
    width: 110px;
    height: 110px;
    margin: 0 auto 25px;
    cursor: pointer;
  }

  .avatar-preview {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 2px dashed #3d3d3d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    color: #555;
    overflow: hidden;
    transition: all 0.25s ease;
  }

  .avatar-preview:hover {
    border-color: #666;
    background: #222;
  }

  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-upload input {
    display: none;
  }

  .form-group {
    text-align: left;
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: #999;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    color: #fff;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    outline: none;
    transition: all 0.25s ease;
    font-family: inherit;
    resize: none;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #555;
    background: #1a1a1a;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
  }

  .form-group textarea {
    min-height: 80px;
    max-height: 150px;
  }

  .btn-save {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e0e0e0;
    background: #2e2e2e;
    border: 1px solid #3d3d3d;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    outline: none;
  }

  .btn-save:hover {
    background: #3a3a3a;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
  }

  .btn-save:active {
    transform: scale(0.98);
    background: #262626;
  }

  .btn-back {
    background: transparent;
    border: none;
    color: #666;
    font-size: 13px;
    margin-top: 15px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.2s;
  }

  .btn-back:hover {
    color: #aaa;
  }

  /* ===== ИГРОВОЕ МЕНЮ ===== */
  .game-menu {
    display: none;
    position: relative;
    width: 100%;
    max-width: 700px;
    padding: 30px 40px 110px;
    border: 1px solid #1a1a1a;
    border-radius: 28px;
    background: #0a0a0a;
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.04);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .game-menu.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .profile-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .profile-mini-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    overflow: hidden;
    color: #888;
  }

  .profile-mini-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-mini-name {
    font-size: 14px;
    color: #ccc;
    font-weight: bold;
  }

  .balance-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 30px;
  }

  .balance-box .star-icon {
    width: 18px;
    height: 18px;
    fill: #777;
  }

  .balance-value {
    font-size: 16px;
    font-weight: bold;
    color: #e0e0e0;
    min-width: 30px;
    text-align: center;
  }

  /* ===== КОЛЕСО ===== */
  .wheel-wrapper {
    position: relative;
    width: 420px;
    height: 420px;
    margin: 10px auto 20px;
  }

  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #ffffff;
    z-index: 10;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
  }

  .wheel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(
      from -90deg,
      #555555 0deg 30deg,
      #0d0d0d 30deg 60deg,
      #555555 60deg 90deg,
      #0d0d0d 90deg 120deg,
      #555555 120deg 150deg,
      #0d0d0d 150deg 180deg,
      #555555 180deg 210deg,
      #0d0d0d 210deg 240deg,
      #555555 240deg 270deg,
      #0d0d0d 270deg 300deg,
      #555555 300deg 330deg,
      #0d0d0d 330deg 360deg
    );
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.05);
    transition: transform 5s cubic-bezier(0.17, 0.67, 0.16, 1);
  }

  .wheel-dashed {
    position: absolute;
    top: -12px;
    left: -12px;
    width: calc(100% + 24px);
    height: calc(100% + 24px);
    border-radius: 50%;
    border: 3px dashed #555;
    z-index: 5;
    pointer-events: none;
  }

  .wheel-marks {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    z-index: 3;
    pointer-events: none;
  }

  .mark {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 45px;
    background: #6a6a6a;
    border-radius: 4px;
    transform-origin: center top;
    margin-top: -45px;
    margin-left: -4px;
  }

  .star-deco {
    position: absolute;
    font-size: 20px;
    color: #666;
    z-index: 4;
    pointer-events: none;
  }

  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #111;
    border: 2px solid #333;
    z-index: 6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    color: #888;
  }

  /* ===== СТАВКА ===== */
  .bet-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 10px;
  }

  .bet-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }

  .bet-input-wrap {
    display: flex;
    align-items: center;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 0 10px;
    flex: 1;
    max-width: 280px;
  }

  .bet-input-wrap .star-icon {
    width: 16px;
    height: 16px;
    fill: #777;
    margin-right: 8px;
  }

  .bet-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
    padding: 14px 0;
    font-family: inherit;
    width: 100%;
  }

  .bet-input::-webkit-outer-spin-button,
  .bet-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .bet-input[type=number] {
    -moz-appearance: textfield;
  }

  .quick-bets {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .quick-bet {
    padding: 8px 16px;
    font-size: 13px;
    color: #ccc;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .quick-bet:hover {
    background: #2a2a2a;
    border-color: #444;
    color: #fff;
  }

  .quick-bet:active {
    transform: scale(0.95);
  }

  .btn-spin {
    width: 100%;
    max-width: 400px;
    margin: 10px auto 0;
    padding: 18px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e0e0e0;
    background: #2e2e2e;
    border: 1px solid #3d3d3d;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    outline: none;
  }

  .btn-spin:hover:not(:disabled) {
    background: #3a3a3a;
    color: #fff;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
  }

  .btn-spin:active:not(:disabled) {
    transform: scale(0.98);
    background: #262626;
  }

  .btn-spin:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .result-message {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    height: 24px;
    margin-top: 15px;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }

  .result-message.win {
    color: #b8ffb8;
    text-shadow: 0 0 15px rgba(150, 255, 150, 0.5);
  }

  .result-message.lose {
    color: #ff8888;
    text-shadow: 0 0 15px rgba(255, 100, 100, 0.5);
  }

  /* ===== ЭКРАН ПРОФИЛЯ ===== */
  .profile-view {
    display: none;
    text-align: center;
    padding: 40px 40px 40px;
    border: 1px solid #1a1a1a;
    border-radius: 20px;
    background: #050505;
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
    width: 100%;
    max-width: 520px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-bottom: 90px;
  }

  .profile-view.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .view-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: #1a1a1a;
    border: 2px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    color: #555;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
  }

  .view-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .view-nick {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .view-username {
    font-size: 15px;
    color: #666;
    margin-bottom: 20px;
  }

  .view-bio {
    font-size: 15px;
    color: #aaa;
    line-height: 1.6;
    padding: 18px;
    background: #0d0d0d;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    margin-bottom: 20px;
    word-wrap: break-word;
  }

  /* ===== ИНВЕНТАРЬ ПОДАРКОВ ===== */
  .inventory-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: #0d0d0d;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  .inventory-title {
    font-size: 15px;
    font-weight: bold;
    color: #ccc;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .inventory-title svg {
    width: 18px;
    height: 18px;
    fill: #888;
  }

  .inventory-count {
    font-size: 14px;
    font-weight: bold;
    color: #888;
    background: #1a1a1a;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
  }

  .gift-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .gift-empty {
    grid-column: 1 / -1;
    padding: 30px 20px;
    text-align: center;
    color: #555;
    font-size: 14px;
    background: #0d0d0d;
    border: 1px dashed #1f1f1f;
    border-radius: 12px;
  }

  .gift-empty-emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
    opacity: 0.4;
  }

  .btn-close-profile {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ccc;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn-close-profile:hover {
    background: #2a2a2a;
    color: #fff;
  }

  /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
  .bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 8px;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 50px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .bottom-nav.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #888;
    background: transparent;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  .nav-btn:hover {
    color: #ccc;
    background: #1f1f1f;
  }

  .nav-btn.active {
    color: #fff;
    background: #2a2a2a;
    box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.06);
  }

  .nav-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  @media (max-width: 560px) {
    .wheel-wrapper {
      width: 320px;
      height: 320px;
    }
    .game-menu {
      padding: 20px 20px 100px;
    }
    .pointer {
      top: -14px;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #ffffff;
    }
    .nav-btn {
      padding: 10px 18px;
      font-size: 13px;
    }
    .bottom-nav {
      bottom: 12px;
    }
  }
</style>
</head>
<body>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="menu" id="mainMenu">
    <div class="icon">4</div>
    <h1 class="title">4ooth</h1>
    <p class="subtitle">Лучшая казино игра в статик</p>
    <button class="btn-start" id="btnStart">Начать общение</button>
  </div>

  <!-- ФОРМА ПРОФИЛЯ -->
  <div class="profile-form" id="profileForm">
    <h2 class="form-title">Создай профиль</h2>
    <p class="form-subtitle">Заполни информацию о себе</p>

    <label class="avatar-upload">
      <div class="avatar-preview" id="avatarPreview">+</div>
      <input type="file" id="avatarInput" accept="image/*">
    </label>

    <div class="form-group">
      <label>Ник</label>
      <input type="text" id="nickInput" placeholder="Введи свой ник" maxlength="20">
    </div>

    <div class="form-group">
      <label>Юзернейм</label>
      <input type="text" id="usernameInput" placeholder="@username" maxlength="20">
    </div>

    <div class="form-group">
      <label>Био</label>
      <textarea id="bioInput" placeholder="Расскажи о себе..." maxlength="150"></textarea>
    </div>

    <button class="btn-save" id="btnSave">Сохранить</button>
    <button class="btn-back" id="btnBack">← Назад</button>
  </div>

  <!-- ИГРОВОЕ МЕНЮ -->
  <div class="game-menu" id="gameMenu">
    <div class="top-bar">
      <div class="profile-mini" id="profileMini">
        <div class="profile-mini-avatar" id="miniAvatar">4</div>
        <div class="profile-mini-name" id="miniName">Игрок</div>
      </div>
      <div class="balance-box">
        <svg class="star-icon" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="balance-value" id="balanceValue">300</span>
      </div>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <div class="wheel-dashed"></div>
      <div class="wheel" id="wheel">
        <div class="wheel-marks">
          <div class="mark" style="transform: rotate(0deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(30deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(60deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(90deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(120deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(150deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(180deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(210deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(240deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(270deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(300deg) translateY(-50%);"></div>
          <div class="mark" style="transform: rotate(330deg) translateY(-50%);"></div>
        </div>

        <div class="star-deco" style="top: 8%; left: 50%; transform: translateX(-50%);">★</div>
        <div class="star-deco" style="top: 20%; right: 12%;">★</div>
        <div class="star-deco" style="top: 50%; right: 4%; transform: translateY(-50%);">★</div>
        <div class="star-deco" style="bottom: 20%; right: 12%;">★</div>
        <div class="star-deco" style="bottom: 8%; left: 50%; transform: translateX(-50%);">★</div>
        <div class="star-deco" style="bottom: 20%; left: 12%;">★</div>
        <div class="star-deco" style="top: 50%; left: 4%; transform: translateY(-50%);">★</div>
        <div class="star-deco" style="top: 20%; left: 12%;">★</div>
      </div>
      <div class="wheel-center">★</div>
    </div>

    <div class="bet-panel">
      <div class="bet-row">
        <div class="bet-input-wrap">
          <svg class="star-icon" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <input type="number" class="bet-input" id="betInput" min="1" value="1" placeholder="Ставка">
        </div>
      </div>

      <div class="quick-bets">
        <button class="quick-bet" data-bet="1">1★</button>
        <button class="quick-bet" data-bet="10">10★</button>
        <button class="quick-bet" data-bet="50">50★</button>
        <button class="quick-bet" data-bet="100">100★</button>
        <button class="quick-bet" data-bet="all">ВСЁ</button>
      </div>

      <button class="btn-spin" id="btnSpin">Крутить</button>
      <div class="result-message" id="resultMessage"></div>
    </div>
  </div>

  <!-- ЭКРАН ПРОФИЛЯ -->
  <div class="profile-view" id="profileView">
    <div class="view-avatar" id="viewAvatar">4</div>
    <div class="view-nick" id="viewNick">Ник</div>
    <div class="view-username" id="viewUsername">@username</div>
    <div class="view-bio" id="viewBio">Био</div>

    <!-- ИНВЕНТАРЬ ПОДАРКОВ -->
    <div class="inventory-header">
      <div class="inventory-title">
        <svg viewBox="0 0 24 24">
          <path d="M20 7h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-5.5-1.65l-.5.67-.5-.68A3 3 0 0 0 6 5c0 .35.07.69.18 1H4a2 2 0 0 0-2 2v2h1v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9h1V9a2 2 0 0 0-2-2zm-5-2a1 1 0 1 1 0 2h-1.5l1-1.34A1 1 0 0 1 15 5zM9 5a1 1 0 1 1 1.5.66L9.5 7H8a1 1 0 0 1 1-2zM4 9h16v1H4V9zm1 3h14v7H5v-7z"/>
        </svg>
        Инвентарь подарков
      </div>
      <div class="inventory-count" id="giftCount">0 шт.</div>
    </div>

    <div class="gift-grid" id="giftGrid">
      <!-- JS заполнит -->
    </div>

    <button class="btn-close-profile" id="btnCloseProfile">Закрыть</button>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" id="navCrash" data-tab="crash">
      <svg viewBox="0 0 24 24">
        <path d="M3 17l6-6 4 4 8-8v6h2V3h-8v2h4l-6 6-4-4-8 8z"/>
      </svg>
      Краш
    </button>
    <button class="nav-btn" id="navProfile" data-tab="profile">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/>
      </svg>
      Профиль
    </button>
  </div>

<script>
  // ====== ЭЛЕМЕНТЫ ======
  const mainMenu = document.getElementById('mainMenu');
  const profileForm = document.getElementById('profileForm');
  const profileView = document.getElementById('profileView');
  const gameMenu = document.getElementById('gameMenu');

  const btnStart = document.getElementById('btnStart');
  const btnSave = document.getElementById('btnSave');
  const btnBack = document.getElementById('btnBack');
  const btnCloseProfile = document.getElementById('btnCloseProfile');

  const avatarInput = document.getElementById('avatarInput');
  const avatarPreview = document.getElementById('avatarPreview');
  const nickInput = document.getElementById('nickInput');
  const usernameInput = document.getElementById('usernameInput');
  const bioInput = document.getElementById('bioInput');

  const viewAvatar = document.getElementById('viewAvatar');
  const viewNick = document.getElementById('viewNick');
  const viewUsername = document.getElementById('viewUsername');
  const viewBio = document.getElementById('viewBio');

  const miniAvatar = document.getElementById('miniAvatar');
  const miniName = document.getElementById('miniName');
  const profileMini = document.getElementById('profileMini');

  const wheel = document.getElementById('wheel');
  const btnSpin = document.getElementById('btnSpin');
  const betInput = document.getElementById('betInput');
  const balanceValue = document.getElementById('balanceValue');
  const resultMessage = document.getElementById('resultMessage');

  const bottomNav = document.getElementById('bottomNav');
  const navCrash = document.getElementById('navCrash');
  const navProfile = document.getElementById('navProfile');

  const giftGrid = document.getElementById('giftGrid');
  const giftCount = document.getElementById('giftCount');

  // ====== СОСТОЯНИЕ ======
  let avatarData = null;
  let balance = 300;
  let isSpinning = false;
  let currentRotation = 0;

  // ====== ИНВЕНТАРЬ ПОДАРКОВ (пустой) ======
  let gifts = [];

  function renderGifts() {
    giftGrid.innerHTML = '';

    const total = gifts.reduce((sum, g) => sum + g.count, 0);
    giftCount.textContent = `${total} шт.`;

    if (gifts.length === 0 || total === 0) {
      giftGrid.innerHTML = `
        <div class="gift-empty">
          <span class="gift-empty-emoji">🎁</span>
          Подарков пока нет...
        </div>`;
      return;
    }

    gifts.forEach(g => {
      if (g.count <= 0) return;
      const item = document.createElement('div');
      item.className = 'gift-item';
      item.innerHTML = `
        <span class="gift-count">×${g.count}</span>
        <span class="gift-emoji">${g.emoji}</span>
        <span class="gift-name">${g.name}</span>
      `;
      giftGrid.appendChild(item);
    });
  }

  // ====== ПЕРЕХОДЫ ======
  btnStart.addEventListener('click', () => {
    mainMenu.style.opacity = '0';
    mainMenu.style.transform = 'translateY(-20px)';
    setTimeout(() => {
      mainMenu.style.display = 'none';
      profileForm.classList.add('active');
    }, 300);
  });

  avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      avatarData = event.target.result;
      avatarPreview.innerHTML = `<img src="${avatarData}" alt="avatar">`;
    };
    reader.readAsDataURL(file);
  });

  btnSave.addEventListener('click', () => {
    const nick = nickInput.value.trim();
    const username = usernameInput.value.trim();
    const bio = bioInput.value.trim();

    if (!nick) {
      nickInput.focus();
      nickInput.style.borderColor = '#a33';
      setTimeout(() => nickInput.style.borderColor = '', 1500);
      return;
    }

    if (avatarData) {
      viewAvatar.innerHTML = `<img src="${avatarData}" alt="avatar">`;
      miniAvatar.innerHTML = `<img src="${avatarData}" alt="avatar">`;
    } else {
      viewAvatar.textContent = nick.charAt(0).toUpperCase();
      miniAvatar.textContent = nick.charAt(0).toUpperCase();
    }
    viewNick.textContent = nick;
    miniName.textContent = nick;
    viewUsername.textContent = username ? (username.startsWith('@') ? username : '@' + username) : '@user';
    viewBio.textContent = bio || 'Био пока не заполнено...';

    renderGifts();

    profileForm.classList.remove('active');
    setTimeout(() => {
      gameMenu.classList.add('active');
      bottomNav.classList.add('visible');
      setActiveTab('crash');
    }, 200);
  });

  btnBack.addEventListener('click', () => {
    profileForm.classList.remove('active');
    setTimeout(() => {
      mainMenu.style.display = 'block';
      requestAnimationFrame(() => {
        mainMenu.style.opacity = '1';
        mainMenu.style.transform = 'translateY(0)';
      });
    }, 200);
  });

  profileMini.addEventListener('click', () => {
    openProfileTab();
  });

  btnCloseProfile.addEventListener('click', () => {
    openCrashTab();
  });

  // ====== БЫСТРЫЕ СТАВКИ ======
  document.querySelectorAll('.quick-bet').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.bet;
      if (val === 'all') {
        betInput.value = balance;
      } else {
        betInput.value = val;
      }
    });
  });

  function updateBalance() {
    balanceValue.textContent = balance;
  }

  // ====== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ======
  function setActiveTab(tab) {
    if (tab === 'crash') {
      navCrash.classList.add('active');
      navProfile.classList.remove('active');
    } else {
      navProfile.classList.add('active');
      navCrash.classList.remove('active');
    }
  }

  function openCrashTab() {
    profileView.classList.remove('active');
    setTimeout(() => {
      gameMenu.classList.add('active');
      setActiveTab('crash');
    }, 200);
  }

  function openProfileTab() {
    gameMenu.classList.remove('active');
    setTimeout(() => {
      renderGifts();
      profileView.classList.add('active');
      setActiveTab('profile');
    }, 200);
  }

  navCrash.addEventListener('click', openCrashTab);
  navProfile.addEventListener('click', openProfileTab);

  // ====== ВРАЩЕНИЕ КОЛЕСА ======
  btnSpin.addEventListener('click', () => {
    if (isSpinning) return;

    let bet = parseInt(betInput.value);

    if (isNaN(bet) || bet < 1) {
      resultMessage.textContent = 'Минимальная ставка — 1★';
      resultMessage.className = 'result-message lose';
      return;
    }
    if (bet > balance) {
      resultMessage.textContent = 'Недостаточно звёзд!';
      resultMessage.className = 'result-message lose';
      return;
    }

    isSpinning = true;
    btnSpin.disabled = true;
    resultMessage.textContent = '';
    resultMessage.className = 'result-message';

    balance -= bet;
    updateBalance();

    const isWin = Math.random() < 0.5;

    let sectorIndex;
    if (isWin) {
      sectorIndex = Math.floor(Math.random() * 6) * 2;
    } else {
      sectorIndex = Math.floor(Math.random() * 6) * 2 + 1;
    }

    const sectorCenter = 15 + 30 * sectorIndex;
    const jitter = (Math.random() - 0.5) * 20;
    const targetMod = ((360 - (sectorCenter + jitter)) % 360 + 360) % 360;
    const base = ((currentRotation % 360) + 360) % 360;

    let delta = targetMod - base;
    if (delta < 0) delta += 360;

    const fullSpins = 5 + Math.floor(Math.random() * 3);
    const rotationNew = currentRotation + fullSpins * 360 + delta;
    currentRotation = rotationNew;

    wheel.style.transition = 'none';
    void wheel.offsetWidth;
    wheel.style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.16, 1)';
    wheel.style.transform = `rotate(${rotationNew}deg)`;

    const pointingAngle = ((360 - (rotationNew % 360)) % 360 + 360) % 360;
    const pointingSector = Math.floor(pointingAngle / 30);
    const actuallyWin = (pointingSector % 2 === 0);

    setTimeout(() => {
      if (actuallyWin) {
        const winAmount = bet * 2;
        balance += winAmount;
        resultMessage.textContent = `ПОБЕДА! +${bet}★`;
        resultMessage.className = 'result-message win';
      } else {
        resultMessage.textContent = `Проигрыш... -${bet}★`;
        resultMessage.className = 'result-message lose';
      }
      updateBalance();
      isSpinning = false;
      btnSpin.disabled = false;
    }, 5000);
  });

  updateBalance();
  renderGifts();
</script>
</body>
</html>
